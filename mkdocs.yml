site_name: tofi — Tests on Feature Importance
site_url: https://aipsylab.github.io/tofi/
repo_url: https://github.com/aipsylab/tofi
theme:
  name: material
nav:
  - Home: index.md
  - API reference: api.md
  - Changelog: changelog.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
